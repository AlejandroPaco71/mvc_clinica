{% extends 'base.html' %}
{% block title %} USUARIO | EDIT {% endblock %}

{% block content %}

<h1>Actualizar Usuario</h1>



<form action="{{ url_for('usuario.edit', id=usuario.id) }}" method="POST">
    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre Completo</label>
        <input type="text" class="form-control" name="nombre" value="{{ usuario.nombre }}" required>
    </div>
    <div class="mb-3">
        <label for="username" class="form-label">Usuario</label>
        <input type="text" class="form-control" name="username" value="{{ usuario.username }}" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" name="password" placeholder="Dejar en blanco para no cambiar">
    </div>
    
    <div class="mb-3">
        <label for="confirm_password" class="form-label">Confirmar Contraseña</label>
        <input type="password" class="form-control" name="confirm_password" placeholder="Dejar en blanco para no cambiar">
    </div>

    <div class="mb-3">
        <label for="rol" class="form-label">Rol</label>
        <select name="rol" class="form-control" required>
            <option value="usuario" {% if usuario.rol == 'usuario' %}selected{% endif %}>Usuario normal</option>
            <option value="admin" {% if usuario.rol == 'admin' %}selected{% endif %}>Administrador</option>
        </select>
    </div>

    <button type="submit" class="btn btn-success">Registrarse</button>
    <a class="btn btn-secondary" href="/usuarios/">Cancelar</a>
</form>



{% endblock %}
