{% extends 'base.html' %}
{% block title %} CONSULTAS | EDIT {% endblock %}

{% block content %}

<h1>Actualizar Consulta</h1>

<form action="{{ url_for('consulta.edit', id=consulta.id) }}" method="POST">
    <div class="mb-3">
        <label for="" class="form-label">Médico</label>
        <select name="medico_id" class="form-control" required>
            <option value="">Seleccione un médico</option>
            {% for medico in medicos %}
                <option value="{{ medico.id }}" {% if medico.id == consulta.medico_id %} selected {% endif %}>
                    {{ medico.nombre }} - {{ medico.especialidad }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="" class="form-label">Paciente</label>
        <select name="paciente_id" class="form-control" required>
            <option value="">Seleccione un paciente</option>
            {% for paciente in pacientes %}
                <option value="{{ paciente.id }}" {% if paciente.id == consulta.paciente_id %} selected {% endif %}>
                    {{ paciente.nombre }} ({{ paciente.edad }} años)
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="" class="form-label">Fecha</label>
        <input type="date" class="form-control" name="fecha" value="{{ consulta.fecha.strftime('%Y-%m-%d') }}" required>
    </div>
    <div class="mb-3">
        <label for="" class="form-label">Diagnóstico</label>
        <textarea class="form-control" name="diagnostico" rows="4" required>{{ consulta.diagnostico }}</textarea>
    </div>
    <div class="mb-3">
        <label for="" class="form-label">Tratamiento</label>
        <textarea class="form-control" name="tratamiento" rows="4" required>{{ consulta.tratamiento }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">Actualizar consulta</button>
    <a class="btn btn-secondary" href="/consultas/">Cancelar</a>
</form>

{% endblock %}
